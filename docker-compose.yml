version: '3.8'

services:
  # PostgreSQL + pgvector Database Service
  postgres:
    image: pgvector/pgvector:pg16
    container_name: farm360_postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-farm360}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-farm360}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Distributed Cache Service
  redis:
    image: redis:7-alpine
    container_name: farm360_redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  farm360-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: farm360_agent_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FARM360_API_KEY=${FARM360_API_KEY}
      - FARM360_ENCRYPTION_KEY=${FARM360_ENCRYPTION_KEY}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-farm360}}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENWEATHERMAP_API_KEY=${OPENWEATHERMAP_API_KEY}
    volumes:
      # Mount models folder dynamically avoiding large container images if preferred
      - ./machine_learning/models:/app/machine_learning/models
      - ./machine_learning/crop_regression/models:/app/machine_learning/crop_regression/models
      - ./machine_learning/crop_vision/models:/app/machine_learning/crop_vision/models
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Service Configuration
  farm360-frontend:
    image: node:20-alpine
    container_name: farm360_nextjs_frontend
    working_dir: /app
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://farm360-backend:8000
      - BACKEND_API_URL=http://farm360-backend:8000
      - FARM360_API_KEY=${FARM360_API_KEY}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run build && npm start"
    depends_on:
      - farm360-backend

volumes:
  postgres_data:
  redis_data:
